name: Publish Naturia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: naturia-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Naturia
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p public/assets
          cp index.html styles.css naturia-v2.css data.js naturia-data-extra.js worldmap.js app.js naturia-v2.js naturia-companion.js naturia-journal.js robots.txt sitemap.xml .nojekyll public/
          cp assets/anime-coast.webp assets/favicon.svg public/assets/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
